name: Code Quality

# Jobs run on the AryeoHQ VPC CodeBuild runner, which can reach Artifactory, and run PHP in
# Docker through ./.github/actions/php, because the runner has no PHP of its own.

on:
  push:

concurrency:
  cancel-in-progress: true
  group: code-quality-${{ github.ref }}

jobs:
  code-style:
    runs-on: codebuild-linux-amd64-vpc-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Install Composer dependencies
        run: php-ci composer install --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: php-ci ./vendor/bin/testbench tooling:pint --test

  static-analysis:
    runs-on: codebuild-linux-amd64-vpc-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Install Composer dependencies
        run: php-ci composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Testbench cache dir
        run: mkdir -p ./vendor/orchestra/testbench-core/laravel/bootstrap/cache

      - name: Run static analysis on application
        run: php-ci ./vendor/bin/testbench tooling:phpstan --memory-limit=4G --error-format=github

  dependency-analysis:
    runs-on: codebuild-linux-amd64-vpc-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/php

      - name: Install Composer dependencies
        run: php-ci composer install --prefer-dist --no-interaction --no-progress

      - name: Check dependencies
        run: php-ci ./vendor/bin/composer-dependency-analyser

  tests:
    runs-on: codebuild-linux-amd64-vpc-${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.5]
        laravel: [12.*, 13.*]
        database: [sqlite, pgsql]
        include:
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.database }} - ${{ matrix.os }}

    steps:
      - name: Checkout ref
        uses: actions/checkout@v6

      - name: Setup PHP
        uses: ./.github/actions/php
        with:
          php_version: ${{ matrix.php }}
          coverage: pcov

      - name: Start PostgreSQL
        if: matrix.database == 'pgsql'
        run: |
          docker network create php-ci-postgres
          docker run --detach --name postgres --network php-ci-postgres \
            -e POSTGRES_DB=testing -e POSTGRES_PASSWORD=secret \
            --health-cmd "pg_isready -U postgres -d testing" \
            --health-interval 2s --health-timeout 3s --health-retries 30 \
            postgres:16
          for attempt in $(seq 60); do
            if [ "$(docker inspect --format '{{.State.Health.Status}}' postgres)" = healthy ]; then
              exit 0
            fi
            sleep 2
          done
          docker logs postgres
          echo "::error::PostgreSQL did not become healthy"
          exit 1

      - name: Join php-ci to the PostgreSQL network
        if: matrix.database == 'pgsql'
        run: |
          wrapper="$RUNNER_TEMP/php-ci/bin/php-ci"
          sed -i "s|exec docker run --rm |exec docker run --rm --network php-ci-postgres -e DB_CONNECTION=pgsql -e DB_HOST=postgres |" "$wrapper"
          grep -q -- "--network php-ci-postgres" "$wrapper" || { echo "::error::$wrapper no longer starts with 'exec docker run --rm'"; exit 1; }

      - name: Install Composer dependencies
        run: php-ci composer install --no-interaction

      - name: List installed Composer dependencies
        run: php-ci composer show -D

      - name: Run tests
        if: matrix.database == 'sqlite'
        run: php-ci ./vendor/bin/testbench package:test --parallel --coverage-cobertura coverage.xml

      - name: Run tests on PostgreSQL
        if: matrix.database == 'pgsql'
        run: php-ci ./vendor/bin/testbench package:test

      - name: Code Coverage Report
        if: matrix.database == 'sqlite'
        uses: irongut/CodeCoverageSummary@v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          format: markdown
          hide_branch_rate: false
          hide_complexity: false
          indicators: true
          output: both
          thresholds: '75 90'

      - name: Add Coverage PR Comment
        uses: marocchino/sticky-pull-request-comment@v2
        if: github.event_name == 'pull_request' && matrix.database == 'sqlite'
        with:
          recreate: true
          path: code-coverage-results.md
